<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04091a" />
      <stop offset="50%" stop-color="#07122b" />
      <stop offset="100%" stop-color="#0b1b40" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#0088ff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0044cc" stop-opacity="0.3" />
    </linearGradient>

    <!-- Primary D-Code Cyan-Blue Gradient -->
    <linearGradient id="dGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f7ff" />
      <stop offset="25%" stop-color="#00d2ff" />
      <stop offset="65%" stop-color="#0077ff" />
      <stop offset="100%" stop-color="#0048db" />
    </linearGradient>

    <!-- Orbit Swoosh Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f7ff" />
      <stop offset="45%" stop-color="#00b4ff" />
      <stop offset="85%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Code Accent Gradient -->
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#00f5ff" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Modern Rounded Squircle Container for Universal Contrast -->
  <rect
    x="3"
    y="3"
    width="122"
    height="122"
    rx="28"
    fill="url(#bgGrad)"
    stroke="url(#borderGrad)"
    stroke-width="2.5"
  />

  <!-- Background Orbit Arc (Passes behind D) -->
  <path
    d="M 28 58 C 30 42 50 28 78 28 C 96 28 110 35 116 46"
    stroke="url(#orbitGrad)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-opacity="0.35"
  />

  <!-- Main D Symbol Body -->
  <!-- Top Fin / Cyber 1-Stem -->
  <path
    d="M 34 32 L 47 18 L 47 98 L 34 98 Z"
    fill="url(#dGrad)"
    filter="url(#subtleGlow)"
  />

  <!-- Bold Curved D Loop with Inner Cutout -->
  <path
    d="M 47 24 L 71 24 C 89 24 102 36 102 59 C 102 82 89 94 71 94 L 47 94 Z
       M 59 38 L 68 38 C 79 38 87 46 87 59 C 87 72 79 80 68 80 L 59 80 Z"
    fill="url(#dGrad)"
    fill-rule="evenodd"
    filter="url(#subtleGlow)"
  />

  <!-- Code Chevron Brackets < > Inside the D Counter -->
  <path
    d="M 68 53 L 63 59 L 68 65"
    stroke="url(#codeGrad)"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M 77 53 L 82 59 L 77 65"
    stroke="url(#codeGrad)"
    stroke-width="2.8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Dynamic Foreground Orbit Swoosh (Loops in front of D) -->
  <path
    d="M 14 86 C 18 99 36 108 62 108 C 89 108 108 97 115 80 C 117 76 117 72 115 69 C 113 67 109 68 107 71 C 101 83 85 92 62 92 C 41 92 27 85 22 76 C 20 72 16 73 15 76 C 13 79 13 83 14 86 Z"
    fill="url(#orbitGrad)"
    filter="url(#subtleGlow)"
  />

  <!-- Highlight Glint on Orbit Tip -->
  <circle cx="114" cy="74" r="2.5" fill="#ffffff" opacity="0.9" />
</svg>